<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Водяной замок</title>
<style>
:root{--bg:#0b1218;--ink:#cfe6ee}
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#14303d,#070c10 70%);font-family:Georgia,serif;color:var(--ink)}
.wrap{display:flex;flex-direction:column;align-items:center;padding:20px}
.shackle{width:300px;height:150px;margin-bottom:-6px;position:relative;z-index:1;transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
.shackle svg{width:100%;height:100%;overflow:visible}
.open .shackle{transform:translateY(-34px) rotate(-16deg) translateX(-18px)}
.lock{position:relative;width:min(94vw,620px);padding:22px 20px 18px;border-radius:26px;
 background:linear-gradient(160deg,#2f4a57,#1a2e38 55%,#142630);
 border:3px solid #6f98a8;box-shadow:0 20px 60px #000c,inset 0 0 40px #0008,inset 0 0 0 6px #1b3340;overflow:hidden}
.lock.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.water{position:absolute;inset:0;pointer-events:none;opacity:.55}
.water svg{width:100%;height:100%}
.w1{animation:wv 7s linear infinite}.w2{animation:wv 11s linear infinite reverse}
@keyframes wv{to{transform:translateX(-120px)}}
.drop{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:34px;opacity:.9}
.reels{position:relative;display:flex;gap:10px;justify-content:center;margin-top:30px}
.reel{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:6px}
.btn{width:100%;height:30px;border:2px solid #6f98a8;border-radius:10px;background:#1d3a48;color:#9fd3e6;font-size:16px;cursor:pointer}
.btn:active{background:#2c5a70}
.win{width:100%;aspect-ratio:200/230;border:3px solid #6f98a8;border-radius:12px;overflow:hidden;position:relative;background:#222;box-shadow:inset 0 0 18px #000}
.win img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .28s ease}
.win::after{content:"";position:absolute;inset:0;background:linear-gradient(#0009,transparent 22%,transparent 78%,#0009);pointer-events:none}
.msg{height:28px;margin-top:14px;text-align:center;font-size:17px;letter-spacing:.5px;position:relative}
.ok{color:#8ff0c0}
.hint{margin-top:10px;font-size:12px;opacity:.6;text-align:center}
</style></head><body>

const ANSWER=[0,1,2,3];
const N=IMGS.length;
const pos=[];
let solved=false;
const reels=document.getElementById('reels'),msg=document.getElementById('msg'),lock=document.getElementById('lock');
function start(){
  do{for(let i=0;i<4;i++)pos[i]=Math.floor(Math.random()*N)}while(pos.some(p=>ANSWER.includes(p)));
}
start();
const els=[];
ANSWER.forEach((_,i)=>{
  const r=document.createElement('div');r.className='reel';
  r.innerHTML='<button class="btn">▲</button><div class="win"><img alt=""><img alt=""></div><button class="btn">▼</button>';
  reels.appendChild(r);
  const [up,dn]=r.querySelectorAll('.btn');
  const win=r.querySelector('.win'),imgs=win.querySelectorAll('img');
  let cur=0;
  imgs[0].src=IMGS[pos[i]];
  imgs[1].style.transform='translateY(100%)';
  let busy=false;
  function step(d){
    if(solved||busy)return;busy=true;
    pos[i]=(pos[i]+d+N)%N;
    const a=imgs[cur],b=imgs[1-cur];
    b.style.transition='none';b.style.transform=`translateY(${d>0?100:-100}%)`;b.src=IMGS[pos[i]];
    void b.offsetWidth;
    b.style.transition='';b.style.transform='translateY(0)';
    a.style.transform=`translateY(${d>0?-100:100}%)`;
    cur=1-cur;
    setTimeout(()=>{busy=false;check()},290);
  }
  up.onclick=()=>step(-1);dn.onclick=()=>step(1);
  win.addEventListener('wheel',e=>{e.preventDefault();step(e.deltaY>0?1:-1)},{passive:false});
  let y0=null;
  win.addEventListener('pointerdown',e=>{y0=e.clientY});
  win.addEventListener('pointerup',e=>{if(y0===null)return;const dy=e.clientY-y0;y0=null;if(Math.abs(dy)>20)step(dy<0?1:-1)});
});
function check(){
  if([...pos].sort((x,y)=>x-y).join()!==[...ANSWER].sort((x,y)=>x-y).join()){msg.textContent='';return}
  solved=true;
  msg.innerHTML='<span class="ok">Замок открыт</span>';
  document.getElementById('wrap').classList.add('open');
}
</script></body></html>
